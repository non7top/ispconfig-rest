name: tests

on:
  push:
    branches: [main, '0*']
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, openssl, tokenizer, xml, ctype, bcmath, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p build

      - name: Run tests
        env:
          COMPAT_COLLECT: ${{ github.workspace }}/build/written-columns.json
        run: php artisan test

      - name: Check written columns against the ISPConfig schema
        if: matrix.php == '8.5'
        run: |
          version="$(sed -n 's/^tested_version=//p' ISPCONFIG_COMPAT)"
          sha="$(sed -n 's/^schema_tarball_sha256=//p' ISPCONFIG_COMPAT)"
          [ -n "$sha" ] || { echo "ISPCONFIG_COMPAT needs schema_tarball_sha256"; exit 1; }
          dir="$(mktemp -d)"
          curl -fsSL -o "$dir/ispconfig.tar.gz" "https://www.ispconfig.org/downloads/ISPConfig-${version}.tar.gz"
          echo "${sha}  $dir/ispconfig.tar.gz" | sha256sum -c -
          tar -xzf "$dir/ispconfig.tar.gz" -C "$dir" --wildcards '*/install/sql/*'
          php scripts/check-compat-schema.php build/written-columns.json "$dir"/*/install/sql
