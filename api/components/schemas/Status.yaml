type: object
description: API release, ISPConfig compatibility and logging state behind the readiness probe (administrator keys only).
required: [release, compatible, ispconfig, logging]
properties:
  release:
    type: string
    description: The installed API release, read from the VERSION file; `unknown` when the file cannot be read.
  compatible:
    type: boolean
  ispconfig:
    type: object
    required: [dbversion, required_dbversion, minimum_version]
    properties:
      version:
        type: string
        nullable: true
        description: ISPC_APP_VERSION from monitor_data; null when no ispc_info row exists. Informational only.
      dbversion:
        type: integer
        nullable: true
        description: The schema level found in server.dbversion; null when it cannot be read.
      required_dbversion:
        type: integer
      minimum_version:
        type: string
  logging:
    type: object
    required: [state]
    properties:
      state:
        $ref: './CheckState.yaml'
